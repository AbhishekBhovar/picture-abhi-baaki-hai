<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><style>
*{box-sizing:border-box}html,body{margin:0;background:#050608;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}.app{max-width:520px;margin:auto;min-height:100vh;background:#07090c}.stage{position:relative;width:100%;overflow:hidden}.scene{display:block;width:100%;height:auto;transition:opacity .18s}.controls{position:sticky;bottom:0;background:rgba(5,6,8,.96);border-top:1px solid #3b3020;padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.controls button,.dev button{min-height:48px;border:1px solid #a87827;border-radius:12px;background:#121419;color:#eee;font-weight:700;font-size:14px}.controls button.active{background:#e9a93a;color:#101010}.dev{position:absolute;left:12px;right:12px;bottom:18px;padding:10px;background:rgba(4,5,7,.88);border:1px solid #c58a2b;border-radius:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.dev button{font-size:12px;min-height:42px}.toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);border:1px solid #d79b35;border-radius:999px;padding:9px 14px;font-size:12px;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1}.breathe{animation:breathe 3.5s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.006)}}@media(prefers-reduced-motion:reduce){.breathe{animation:none}}
</style></head><body><main class="app"><div class="stage"><img id="scene" class="scene breathe" src="assets/home.webp" alt="Picture Abhi Baaki Hai visual proof of concept"><div id="toast" class="toast">Visual state changed</div><div id="dev" class="dev"><button id="phys">Physique +</button><button id="style">Style +</button><button id="groom">Grooming +</button></div></div><nav class="controls"><button data-scene="home" class="active">HOME</button><button data-scene="gym">GYM</button><button data-scene="character">DEVELOP</button></nav></main><script>
(()=>{const img=document.querySelector('#scene'),dev=document.querySelector('#dev'),toast=document.querySelector('#toast');let timer;function show(s){img.style.opacity=.25;setTimeout(()=>{img.src='assets/'+s+'.webp';img.alt=s+' visual proof screen';img.style.opacity=1;dev.style.display=s==='character'?'grid':'none'},120);document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('active',b.dataset.scene===s))}document.querySelectorAll('[data-scene]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.scene)));function note(t){toast.textContent=t;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1200)}document.querySelector('#phys').addEventListener('click',()=>note('Physique: Starting → Progress → Fit'));document.querySelector('#style').addEventListener('click',()=>note('Style layer test'));document.querySelector('#groom').addEventListener('click',()=>note('Grooming layer test'));dev.style.display='none';})();
</script></body></html>
